name: SHOOTRZ CI

on:
  push:
    paths:
      - 'SHOOTRZ/**'
      - '.github/workflows/shootrz-ci.yml'
  pull_request:
    paths:
      - 'SHOOTRZ/**'
      - '.github/workflows/shootrz-ci.yml'

jobs:
  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SHOOTRZ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SHOOTRZ/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  backend-contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SHOOTRZ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend contract and durability tests
        run: python -m pytest backend/tests/test_api_contracts.py backend/tests/test_job_store.py -q
