<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOOTRZ — App UI Kit</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#080A0E;font-family:'DM Sans',sans-serif}
#root{height:100%;display:flex;align-items:center;justify-content:center}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
::-webkit-scrollbar{width:0;height:0}
input::placeholder{color:#4A5568}
input,button{font-family:'DM Sans',sans-serif}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>

<script type="text/babel">
const SCREENS_WITH_HEADER = ['home','progress','chat','analyze','profile']
const SCREEN_TITLES = { home:'', progress:'Progress', chat:'Coach J', analyze:'Analyze', profile:'Profile' }

const App = () => {
  const savedScreen = localStorage.getItem('shootrz_screen') || 'login'
  const [screen, setScreen] = React.useState(savedScreen)

  const navigate = (s) => {
    setScreen(s)
    localStorage.setItem('shootrz_screen', s)
  }

  const isLoggedIn = screen !== 'login'
  const activeTab = SCREENS_WITH_HEADER.includes(screen) ? screen : null

  const phoneH = Math.min(window.innerHeight - 32, 812)
  const phoneW = Math.round(phoneH * 390/812)

  return (
    <div style={{
      width: phoneW, height: phoneH,
      background: '#0D1117',
      borderRadius: 44,
      overflow: 'hidden',
      display: 'flex',
      flexDirection: 'column',
      boxShadow: '0 30px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08), inset 0 0 0 1px rgba(255,255,255,0.04)',
      position: 'relative',
    }}>
      {/* Status Bar */}
      <div style={{height:44,background:'#0D1117',display:'flex',alignItems:'flex-end',justifyContent:'space-between',
        padding:'0 28px 8px',flexShrink:0}}>
        <span style={{fontSize:13,fontWeight:600,color:'#F0F4F8'}}>9:41</span>
        <div style={{width:120,height:30,background:'#080A0E',borderRadius:20,position:'absolute',left:'50%',transform:'translateX(-50%)',top:4}}/>
        <div style={{display:'flex',gap:5,alignItems:'center'}}>
          {/* Signal */}
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
            {[1,3,5,7].map((h,i)=>(<rect key={i} x={i*4} y={12-h-1} width="3" height={h} rx="1" fill={i<3?'white':'rgba(255,255,255,0.3)'}/>))}
          </svg>
          {/* Wifi */}
          <svg width="16" height="12" viewBox="0 0 16 12" fill="white">
            <path d="M8 10.5a1 1 0 100-2 1 1 0 000 2z"/>
            <path d="M5 7.5a4 4 0 016 0" strokeWidth="1.5" stroke="white" fill="none"/>
            <path d="M2.5 5A7 7 0 0113.5 5" strokeWidth="1.5" stroke="white" fill="none"/>
          </svg>
          {/* Battery */}
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
            <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" strokeOpacity=".35"/>
            <rect x="2" y="2" width="16" height="8" rx="2" fill="white"/>
            <path d="M23 4v4a2 2 0 000-4z" fill="white" fillOpacity=".4"/>
          </svg>
        </div>
      </div>

      {/* Screen Header (non-home) */}
      {isLoggedIn && screen !== 'home' && (
        <div style={{display:'flex',alignItems:'center',padding:'4px 16px 8px',flexShrink:0,borderBottom:`1px solid rgba(255,255,255,0.05)`}}>
          {screen !== 'home' && (
            <div style={{fontSize:18,fontWeight:700,color:'#F0F4F8',flex:1}}>{SCREEN_TITLES[screen]}</div>
          )}
        </div>
      )}

      {/* Screen Content */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
        {screen==='login' && <LoginScreen onLogin={()=>navigate('home')}/>}
        {screen==='home' && <HomeScreen onNavigate={navigate}/>}
        {screen==='progress' && <ProgressScreen/>}
        {screen==='chat' && <ChatScreen/>}
        {screen==='analyze' && <AnalyzeScreen/>}
        {screen==='profile' && <ProfileScreen onLogout={()=>navigate('login')}/>}
      </div>

      {/* Tab Bar */}
      {isLoggedIn && <TabBar active={screen} onNavigate={navigate}/>}
    </div>
  )
}

const root = ReactDOM.createRoot(document.getElementById('root'))
root.render(<App/>)
</script>
</body>
</html>
