<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D1117;font-family:'DM Sans',sans-serif;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.label{font-size:10px;font-weight:600;color:#4A5568;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.tier{display:inline-flex;align-items:center;border-radius:9999px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:1.5px}
.streak{display:inline-flex;align-items:center;gap:6px;background:#E8521A22;border:1px solid rgba(232,82,26,.35);border-radius:9999px;padding:6px 12px;font-size:13px;font-weight:700;color:#E8521A}
.context-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:9999px;padding:5px 12px;font-size:11px;font-weight:600;color:#00D4FF}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:6px 14px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.1);color:#8B95A3;background:#13181F}
.pill.active{background:#E8521A;color:#F0F4F8;border-color:#E8521A}
</style></head><body>
<div class="label">Score Tier Badges</div>
<div class="row">
  <span class="tier" style="background:#FFD70022;color:#FFD700;border:1px solid rgba(255,215,0,.4)">ELITE</span>
  <span class="tier" style="background:#22C55E22;color:#22C55E;border:1px solid rgba(34,197,94,.4)">GREAT</span>
  <span class="tier" style="background:#3B82F622;color:#3B82F6;border:1px solid rgba(59,130,246,.4)">GOOD</span>
  <span class="tier" style="background:#F59E0B22;color:#F59E0B;border:1px solid rgba(245,158,11,.4)">FAIR</span>
  <span class="tier" style="background:#EF444422;color:#EF4444;border:1px solid rgba(239,68,68,.4)">POOR</span>
</div>
<div class="label">Streak Badge</div>
<div class="row">
  <span class="streak">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="#E8521A"><path d="M12 2C8 7 6 10 6 14a6 6 0 0012 0c0-4-2-7-6-12z"/></svg>
    7 Day Streak
  </span>
  <span class="streak">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="#E8521A"><path d="M12 2C8 7 6 10 6 14a6 6 0 0012 0c0-4-2-7-6-12z"/></svg>
    1 Day Streak
  </span>
</div>
<div class="label">Context Chip</div>
<div class="row">
  <span class="context-chip">
    <svg width="12" height="12" fill="none" stroke="#00D4FF" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
    Profile + History
  </span>
</div>
<div class="label">Period Pills</div>
<div class="row">
  <span class="pill active">Week</span>
  <span class="pill">Month</span>
  <span class="pill">All Time</span>
</div>
<div class="label">Quick Chips</div>
<div class="row">
  <span class="pill" style="border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.06);color:#00D4FF">Review my last shot</span>
  <span class="pill" style="border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.06);color:#00D4FF">Give me a drill plan</span>
  <span class="pill" style="border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.06);color:#00D4FF">Fix my follow-through</span>
</div>
</body></html>
