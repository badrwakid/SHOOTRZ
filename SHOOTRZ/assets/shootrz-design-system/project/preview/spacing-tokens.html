<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D1117;font-family:'DM Sans',sans-serif;padding:16px}
.section{margin-bottom:14px}
.section-label{font-size:10px;font-weight:600;color:#4A5568;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.spacing-row{display:flex;flex-direction:column;gap:4px}
.sp-item{display:flex;align-items:center;gap:10px}
.sp-bar-wrap{flex:1;height:16px;display:flex;align-items:center}
.sp-bar{height:4px;background:#E8521A;border-radius:2px}
.sp-label{font-size:10px;font-family:monospace;color:#4A5568;width:34px;text-align:right;flex-shrink:0}
.sp-px{font-size:10px;font-family:monospace;color:#8B95A3;width:28px}
.divider{height:1px;background:rgba(255,255,255,.06);margin:10px 0}
.radius-row{display:flex;gap:8px;flex-wrap:wrap}
.radius-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.radius-box{width:40px;height:40px;background:#1A2030;border:1px solid rgba(255,255,255,.15)}
.radius-name{font-size:10px;font-family:monospace;color:#8B95A3}
.radius-val{font-size:9px;font-family:monospace;color:#4A5568}
</style></head><body>
<div class="section">
  <div class="section-label">Spacing Scale</div>
  <div class="spacing-row">
    <div class="sp-item"><span class="sp-label">1</span><div class="sp-bar-wrap"><div class="sp-bar" style="width:4px"></div></div><span class="sp-px">4px</span></div>
    <div class="sp-item"><span class="sp-label">2</span><div class="sp-bar-wrap"><div class="sp-bar" style="width:8px"></div></div><span class="sp-px">8px</span></div>
    <div class="sp-item"><span class="sp-label">3</span><div class="sp-bar-wrap"><div class="sp-bar" style="width:12px"></div></div><span class="sp-px">12px</span></div>
    <div class="sp-item"><span class="sp-label">4</span><div class="sp-bar-wrap"><div class="sp-bar" style="width:16px"></div></div><span class="sp-px">16px</span></div>
    <div class="sp-item"><span class="sp-label">5</span><div class="sp-bar-wrap"><div class="sp-bar" style="width:20px"></div></div><span class="sp-px">20px</span></div>
    <div class="sp-item"><span class="sp-label">6</span><div class="sp-bar-wrap"><div class="sp-bar" style="width:24px"></div></div><span class="sp-px">24px</span></div>
    <div class="sp-item"><span class="sp-label">8</span><div class="sp-bar-wrap"><div class="sp-bar" style="width:32px"></div></div><span class="sp-px">32px</span></div>
    <div class="sp-item"><span class="sp-label">10</span><div class="sp-bar-wrap"><div class="sp-bar" style="width:40px"></div></div><span class="sp-px">40px</span></div>
    <div class="sp-item"><span class="sp-label">12</span><div class="sp-bar-wrap"><div class="sp-bar" style="width:48px"></div></div><span class="sp-px">48px</span></div>
  </div>
</div>
<div class="divider"></div>
<div class="section">
  <div class="section-label">Border Radius</div>
  <div class="radius-row">
    <div class="radius-item"><div class="radius-box" style="border-radius:4px"></div><div class="radius-name">xs</div><div class="radius-val">4px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:8px"></div><div class="radius-name">sm</div><div class="radius-val">8px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:12px"></div><div class="radius-name">md</div><div class="radius-val">12px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:16px"></div><div class="radius-name">lg/card</div><div class="radius-val">16px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:20px"></div><div class="radius-name">xl</div><div class="radius-val">20px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:24px"></div><div class="radius-name">2xl</div><div class="radius-val">24px</div></div>
    <div class="radius-item"><div class="radius-box" style="border-radius:9999px"></div><div class="radius-name">full</div><div class="radius-val">pill</div></div>
  </div>
</div>
</body></html>
