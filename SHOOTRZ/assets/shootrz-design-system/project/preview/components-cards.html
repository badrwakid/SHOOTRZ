<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D1117;font-family:'DM Sans',sans-serif;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.label{font-size:10px;font-weight:600;color:#4A5568;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
/* Base card */
.card{background:#13181F;border:1px solid rgba(255,255,255,.071);border-radius:16px;padding:16px}
/* Glass orange */
.card-orange{background:rgba(232,82,26,.12);border:1px solid rgba(232,82,26,.25);border-radius:16px;padding:16px}
/* Glass cyan */
.card-cyan{background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.20);border-radius:16px;padding:16px}
/* Glass modal */
.card-modal{background:rgba(8,10,14,.9);border:1px solid rgba(255,255,255,.05);border-radius:24px;padding:16px}
.card-title{font-size:13px;font-weight:600;color:#F0F4F8}
.card-sub{font-size:11px;color:#8B95A3;margin-top:3px}
.score{font-family:'Barlow Condensed';font-size:38px;font-weight:900;color:#C8D0DC;line-height:1}
.stat-row{display:flex;gap:8px;margin-top:8px}
.stat{flex:1;background:#0D1117;border-radius:10px;padding:8px;text-align:center;border:1px solid rgba(255,255,255,.05)}
.stat-val{font-size:20px;font-weight:800;color:#F0F4F8}
.stat-label{font-size:9px;font-weight:600;color:#8B95A3;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
</style></head><body>
<div class="label">Base Card</div>
<div class="row">
  <div class="card" style="flex:1;min-width:160px">
    <div class="card-title">Session #42</div>
    <div class="card-sub">3 days ago · 5 shots</div>
    <div class="stat-row">
      <div class="stat"><div class="stat-val" style="color:#E8521A">82</div><div class="stat-label">Score</div></div>
      <div class="stat"><div class="stat-val">5</div><div class="stat-label">Shots</div></div>
    </div>
  </div>
</div>
<div class="label">Glass Orange — Hero</div>
<div class="row">
  <div class="card-orange" style="flex:1;display:flex;align-items:center;gap:20px">
    <div style="width:64px;height:64px;border-radius:32px;border:2.5px solid #E8521A;display:flex;align-items:center;justify-content:center">
      <span class="score" style="font-size:24px">82</span>
    </div>
    <div>
      <div style="font-size:10px;font-weight:600;color:#8B95A3;letter-spacing:2px;text-transform:uppercase">Last Session</div>
      <div class="score">82</div>
      <div style="font-size:11px;color:#8B95A3;margin-top:4px">Yesterday</div>
    </div>
  </div>
</div>
<div class="label">Glass Cyan — Coach</div>
<div class="row">
  <div class="card-cyan" style="flex:1;display:flex;align-items:center;gap:12px">
    <div style="width:40px;height:40px;border-radius:20px;background:#00D4FF;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#0D1117;flex-shrink:0">J</div>
    <div style="flex:1"><div class="card-title">Coach J</div><div class="card-sub">Ask me anything about your game...</div></div>
    <svg width="16" height="16" fill="none" stroke="#00D4FF" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
  </div>
</div>
<div class="label">Glass Sheet — Modal</div>
<div class="row">
  <div class="card-modal" style="flex:1">
    <div class="card-title" style="text-align:center">Reset Password</div>
    <div class="card-sub" style="text-align:center;margin-top:4px">Enter your email and we'll send reset instructions.</div>
  </div>
</div>
</body></html>
