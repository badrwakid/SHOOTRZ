<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D1117;font-family:'DM Sans',sans-serif;padding:16px}
.label{font-size:10px;font-weight:600;color:#4A5568;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.tab-bar{display:flex;background:#0D1117;border-top:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;gap:4px;cursor:pointer}
.tab-label{font-size:10px;font-weight:600;letter-spacing:.5px}
.tab-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.section-title{font-size:15px;font-weight:700;color:#F0F4F8}
.section-action{font-size:13px;color:#00D4FF;font-weight:500}
.nav-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05)}
.nav-title{font-size:17px;font-weight:700;color:#F0F4F8}
.progress-bar-wrap{background:#1A2030;border-radius:9999px;height:6px;overflow:hidden;margin-top:6px}
.progress-bar{height:6px;background:linear-gradient(90deg,#E8521A,#FF6B2B);border-radius:9999px}
</style></head><body>
<div class="label">Tab Bar</div>
<div class="tab-bar" style="margin-bottom:14px">
  <div class="tab">
    <div class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8521A" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></div>
    <span class="tab-label" style="color:#E8521A">Home</span>
  </div>
  <div class="tab">
    <div class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2.2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
    <span class="tab-label" style="color:#4A5568">Analyze</span>
  </div>
  <div class="tab">
    <div class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2.2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
    <span class="tab-label" style="color:#4A5568">Progress</span>
  </div>
  <div class="tab">
    <div class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2.2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
    <span class="tab-label" style="color:#4A5568">Coach J</span>
  </div>
  <div class="tab">
    <div class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
    <span class="tab-label" style="color:#4A5568">Profile</span>
  </div>
</div>
<div class="label">Section Header</div>
<div style="background:#13181F;border-radius:12px;padding:12px 16px;margin-bottom:14px">
  <div class="section-header">
    <span class="section-title">Recent Sessions</span>
    <span class="section-action">See all</span>
  </div>
</div>
<div class="label">Screen Header</div>
<div style="background:#13181F;border-radius:12px;margin-bottom:14px">
  <div class="nav-row">
    <div>
      <div style="font-size:20px;font-weight:700;color:#F0F4F8">Good morning, Marcus</div>
      <div style="font-size:11px;font-weight:600;color:#00D4FF;letter-spacing:2px;margin-top:2px">PERFECT THE GAME</div>
    </div>
    <div style="background:rgba(232,82,26,.15);border:1px solid rgba(232,82,26,.35);border-radius:9999px;padding:6px 12px;display:flex;align-items:center;gap:5px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="#E8521A"><path d="M12 2C8 7 6 10 6 14a6 6 0 0012 0c0-4-2-7-6-12z"/></svg>
      <span style="font-size:13px;font-weight:700;color:#E8521A">7</span>
    </div>
  </div>
</div>
<div class="label">Progress Bar</div>
<div style="background:#13181F;border-radius:12px;padding:12px 16px">
  <div style="display:flex;justify-content:space-between;margin-bottom:4px">
    <span style="font-size:12px;color:#8B95A3">Knee Bend</span>
    <span style="font-size:12px;font-weight:600;color:#E8521A">74%</span>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" style="width:74%"></div></div>
  <div style="display:flex;justify-content:space-between;margin-top:8px;margin-bottom:4px">
    <span style="font-size:12px;color:#8B95A3">Follow Through</span>
    <span style="font-size:12px;font-weight:600;color:#22C55E">91%</span>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" style="width:91%;background:linear-gradient(90deg,#22C55E,#4ade80)"></div></div>
</div>
</body></html>
